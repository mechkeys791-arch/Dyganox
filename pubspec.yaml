name: dyganox
description: "Service Provider App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.0.0
  url_launcher: ^6.2.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  amazon_cognito_identity_dart_2: ^3.8.1
  intl: ^0.19.0
  # aws_s3_upload is incompatible with Dart 3.x (only supports Dart 2.x)
  # aws_common and aws_signature_v4 require http ^1.3.0, but amazon_cognito needs http ^1.1.0
  # For S3, use backend API approach (see AWS_S3_PROFILE_PICTURE_SETUP.md)
  # aws_s3_upload: ^1.5.0
  # aws_common: ^0.7.12
  # aws_signature_v4: ^0.3.0
  # Payment gateway - Square (for testing)
  # Note: We're using HTTP-based approach, no Square SDK needed in Flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - web/DYAGNOX_(1)[1].png