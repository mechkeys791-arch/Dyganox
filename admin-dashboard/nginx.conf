# Nginx Configuration for Admin Dashboard
# Copy this file to: /etc/nginx/conf.d/admin-dashboard.conf

server {
    listen 80;
    server_name 34.228.113.212;  # Replace with your domain if you have one
    
    root /var/www/admin-dashboard;
    index index.html;

    # Admin Dashboard - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy (optional - if you want to serve API through same domain)
    # Uncomment if you want to proxy API requests through Nginx
    # location /api/ {
    #     proxy_pass http://localhost:8081;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}

